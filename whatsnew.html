       this page loads, and each face is checked against what this page uses before it
       is added: the family, the weight, the style, a unicode-range that is only a
       unicode-range, and a file that begins with the WOFF2 signature. Opened on its
       own, or before that first release, the page draws the fallbacks. */
    (function () {
        var WANT = { 'Michroma': ['400'], 'Space Mono': ['400', '700'] };
        var RANGE = /^[Uu+0-9A-Fa-f?,\- ]{3,600}$/, MAX_FACES = 16, MAX_FILE = 262144, added = {};
        var woff2 = function (b) { try { var h = new Uint8Array(b, 0, 4); return h[0] === 0x77 && h[1] === 0x4f && h[2] === 0x46 && h[3] === 0x32; } catch (_) { return false; } };
        window.addEventListener('message', function (e) {
            if (window.parent === window || e.source !== window.parent) return;   /* only the page that framed this one */
            var d = e.data;
            if (!d || d.type !== 'SRCD_FONTS' || !Array.isArray(d.faces) || typeof FontFace !== 'function') return;
            d.faces.slice(0, MAX_FACES).forEach(function (f) {
                if (!f || typeof f.family !== 'string' || !Object.prototype.hasOwnProperty.call(WANT, f.family)) return;
                var w = String(f.weight), range = typeof f.range === 'string' ? f.range : '';
                if (WANT[f.family].indexOf(w) === -1 || f.style !== 'normal' || (range && !RANGE.test(range))) return;
                if (!(f.bytes instanceof ArrayBuffer) || f.bytes.byteLength <= 64 || f.bytes.byteLength > MAX_FILE || !woff2(f.bytes)) return;
                var key = f.family + '|' + w + '|' + range;
                if (added[key]) return;
                try {
                    var face = new FontFace(f.family, f.bytes, { weight: w, style: 'normal', unicodeRange: range || 'U+0-10FFFF', display: 'swap' });
                    document.fonts.add(face); face.load().catch(function () {}); added[key] = 1;
                } catch (_) {}
            });
        });
    })();

    // ── RENDER LOGIC ─────────────────────────────────────────────────────────
    const streamContainer = document.getElementById('commit-stream');
    const detailContainer = document.getElementById('log-detail');
    const emptyState = document.getElementById('empty-state');

    const DIVIDERS = {
            "b7e2f19": "v6.4 — CURRENT",
            "5be81c0": "v6.3",
            "6a1f3e0": "v6.2",
            "e3b8d4c": "v6.1.1",
            "d4f9e07": "v6.1",
            "b7e21a4": "v6.1 PLATE LANGUAGE",
        "f1a7c0e": "SYSTEM DOCUMENTATION",
        "7e2a91c": "v6.0",
        "c71e4a9": "v5.6.4",
        "4f746f3": "v5.6.3",
        "f3f1560": "v5.6.2",
        "bfdab95": "v5.6.1",
        "97e4b1d": "v5.6 BASE",
        "9f2a1c8": "EVANSCIRA HISTORICAL"
    };

    /* a sha that appears twice in the log (b7e21a4, c41f8d2, e5a0c93, f08b3e6) drew its
       divider twice: each divider is drawn once, above the first entry that carries it */
    const dividerDrawn = {};
    COMMITS.forEach((commit, index) => {
        if (DIVIDERS[commit.sha] && !dividerDrawn[commit.sha]) {
            dividerDrawn[commit.sha] = true;
            const div = document.createElement('div');
            div.className = 'stream-divider';
            div.textContent = DIVIDERS[commit.sha];
            streamContainer.appendChild(div);
        }
        const node = document.createElement('div');
        node.className = `commit-node cat-${commit.cat || 'feat'}`;
        node.innerHTML = `
            <span class="sha-tag">${commit.sha} // ${commit.tag}</span>
            <div class="commit-title">${commit.desc}</div>
            <div class="commit-meta">
                <span>[${commit.author}]</span>
                <span>${commit.timestamp.split(' ')[1]}</span>
            </div>
        `;
        node.onclick = () => loadCommit(index, node);
        streamContainer.appendChild(node);
    });

    let typeInterval;

    function loadCommit(index, nodeElement) {
        document.querySelectorAll('.commit-node').forEach(n => n.classList.remove('active'));
        nodeElement.classList.add('active');

        emptyState.style.display = 'none';
        detailContainer.classList.remove('visible');

        const data = COMMITS[index];

        setTimeout(() => {
            document.getElementById('detail-sha').innerText = data.sha;
            document.getElementById('detail-tag').innerText = data.tag;
            document.getElementById('detail-author').innerText = `${data.author} :: ${data.role}`;
            document.getElementById('detail-date').innerText = data.timestamp;

            const descBox = document.getElementById('detail-desc');
            const techList = document.getElementById('detail-tech');
            const calloutEl = document.getElementById('detail-callout');
            descBox.innerText = '';
            techList.innerHTML = '';
            calloutEl.style.display = 'none';

            detailContainer.classList.add('visible');

            if (typeInterval) clearInterval(typeInterval);
            let charIndex = 0;
            const text = data.desc;
            descBox.style.borderRightWidth = '2px';

            /* ═ THΞ GLITCH TØØK THΞ TΞXT WITH IT ═ the flicker used to snapshot the line,
               swap its last character for a block, and put the snapshot back 40ms
               later — by which time three more characters had been typed, and the
               snapshot erased them. Reading the line back through innerText also
               dropped any trailing space. Every description lost letters at random
               ("The confiialog rendered behind…"). The typed text is now kept in a
               variable and the box is only ever painted FRØM it, so a flicker is
               something drawn over one tick and never something stored. */
            let typed = '';
            typeInterval = setInterval(() => {
                typed += text.charAt(charIndex);
                charIndex++;
                descBox.textContent = (Math.random() > 0.96)
                    ? typed.slice(0, -1) + (Math.random() > 0.5 ? '█' : '▓')
                    : typed;

                if (charIndex >= text.length) {
                    clearInterval(typeInterval);
                    descBox.textContent = text;
                    descBox.style.borderRightWidth = '0px';

                    data.tech.forEach((item, i) => {
                        setTimeout(() => {
                            const li = document.createElement('li');
                            li.innerHTML = `<span class="bullet">></span><span>${item}</span>`;
                            techList.appendChild(li);
                        }, i * 150);
                    });

                    if (data.callout) {
                        setTimeout(() => {
                            document.getElementById('callout-title').innerText = data.callout.title;
                            document.getElementById('callout-body').innerText = data.callout.body;
                            calloutEl.style.display = 'block';
                        }, data.tech.length * 150 + 200);
                    }
                }
            }, 12);

        }, 200);
    }

    window.onload = () => {
        const firstNode = streamContainer.querySelector('.commit-node');
        if (firstNode) loadCommit(0, firstNode);
    };
