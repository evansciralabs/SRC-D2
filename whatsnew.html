            display: flex;
            flex-direction: column;
        }

            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 999;
        }

        .header {
            padding: 0.75rem 2rem;
            border-bottom: 1px solid rgba(0,255,255,0.3);
            background: rgba(5,10,16,0.95);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            z-index: 10;
        }

        .brand {
            font-family: 'Michroma', sans-serif;
            color: var(--primary);
            text-shadow: 0 0 10px rgba(0,255,255,0.5);
            font-size: 1.1rem;
            letter-spacing: 2px;
        }

        .brand-sub {
            font-family: 'Space Mono', monospace;
            font-size: 0.6rem;
            color: var(--text-dim);
            letter-spacing: 3px;
            margin-left: 0.75rem;
            vertical-align: middle;
        }

        .status-light {
            width: 8px; height: 8px;
            background: var(--secondary);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px var(--secondary);
            animation: pulse 2s infinite;
        }

        /* LAYOUT */
        .main-grid {
            display: grid;
            grid-template-columns: 320px 1fr;
            flex-grow: 1;
            overflow: hidden;
        }

        .stream-pane {
            background: var(--bg-panel);
            border-right: 1px solid rgba(0,255,255,0.1);
            overflow-y: auto;
            padding: 1rem;
        }

        .stream-pane::-webkit-scrollbar-thumb { background: var(--primary); }
        .stream-pane::-webkit-scrollbar-track { background: var(--bg-deep); }

            font-size: 0.6rem;
            font-family: 'Michroma', monospace;
            color: var(--text-dim);
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 0.5rem 0 0.25rem 4px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            margin-bottom: 0.5rem;
            margin-top: 0.75rem;
        }
        .stream-divider:first-child { margin-top: 0; }

        .commit-node {
            margin-bottom: 0.75rem;
            padding: 8px 10px;
            border-left: 2px solid var(--text-dim);
            background: rgba(255,255,255,0.02);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .commit-node:hover {
            background: rgba(0,255,255,0.05);
            border-left-color: var(--primary);
            padding-left: 14px;
        }

        .commit-node.active {
            background: linear-gradient(90deg, rgba(0,255,255,0.1), transparent);
            border-left-color: var(--warning);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);

        .commit-node.cat-threat { border-left-color: #a855f7; }
        .commit-node.cat-threat:hover, .commit-node.cat-threat.active { border-left-color: var(--warning); }
        .commit-node.cat-fix { border-left-color: #ef4444; }
        .commit-node.cat-fix:hover, .commit-node.cat-fix.active { border-left-color: var(--warning); }
        .commit-node.cat-feat { border-left-color: #06b6d4; }
        .commit-node.cat-feat:hover, .commit-node.cat-feat.active { border-left-color: var(--warning); }

        .sha-tag {
            font-family: 'Michroma';
            font-size: 0.65rem;
            color: var(--warning);
            margin-bottom: 3px;
            display: block;
        }

        .commit-title {
            font-size: 0.78rem;
            font-weight: bold;
            color: var(--text-bright);
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

            font-size: 0.6rem;
            color: var(--text-dim);
            margin-top: 5px;
            display: flex;
            justify-content: space-between;

            background-image: radial-gradient(circle at 50% 50%, rgba(20,30,50,0.4), transparent);

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--text-dim);
            font-size: 0.8rem;
            text-align: center;
            opacity: 0.5;

            margin: 0 auto;
            opacity: 0;
            transform: translateY(10px);

            border-bottom: 1px dashed var(--primary);

            margin-bottom: 1.5rem;

            font-family: 'Michroma';
            font-size: 1.8rem;
            color: var(--primary);
            text-shadow: 0 0 15px rgba(0,255,255,0.3);

            font-size: 0.65rem;
            color: var(--secondary);

            margin-left: 10px;
            vertical-align: middle;

            font-size: 0.85rem;
            line-height: 1.7;
            color: #cbd5e1;
        }

        .log-section { margin-bottom: 1.5rem; }

        .log-subtitle {
            color: var(--text-dim);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            display: block;

        .typewriter-text {
            border-right: 2px solid var(--primary);
            animation: blink 1s step-end infinite;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
            display: block;
            min-height: 1.5em;

            list-style: none;
            padding: 0;
            margin: 0;

            display: flex;
            gap: 8px;
            margin-bottom: 6px;
            font-size: 0.8rem;
            color: var(--primary);
            line-height: 1.5;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        #detail-tech li .bullet {
            color: #4b5563;
            flex-shrink: 0;
        }

        .log-callout {
            background: rgba(168,85,247,0.06);
            border: 1px solid rgba(168,85,247,0.25);
            border-left: 3px solid var(--accent);
            padding: 0.75rem 1rem;
            margin-top: 1rem;
            font-size: 0.75rem;
            line-height: 1.6;
            color: #c4b5fd;
        }

        .log-callout-title {
            font-family: 'Michroma', monospace;
            font-size: 0.65rem;
            color: var(--accent);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            display: block;

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* MOBILE */
        @media (max-width: 768px) {
            .main-grid { grid-template-columns: 1fr; }
            .stream-pane { height: 38vh; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.08); }
            .terminal-pane { height: 62vh; padding: 1rem; }
            .log-sha-large { font-size: 1.3rem; }
        }
    </style>

    // ── RENDER LOGIC ─────────────────────────────────────────────────────────
    const streamContainer = document.getElementById('commit-stream');
    const detailContainer = document.getElementById('log-detail');
    const emptyState = document.getElementById('empty-state');

    const DIVIDERS = {
        "f1a7c0e": "SYSTEM DOCUMENTATION",
        "7e2a91c": "v6.0 — CURRENT",
        "c71e4a9": "v5.6.4",
        "4f746f3": "v5.6.3",
        "f3f1560": "v5.6.2",
        "bfdab95": "v5.6.1",
        "97e4b1d": "v5.6 BASE",
        "9f2a1c8": "EVANSCIRA HISTORICAL"
    };

    COMMITS.forEach((commit, index) => {
        if (DIVIDERS[commit.sha]) {
            const div = document.createElement('div');
            div.className = 'stream-divider';
            div.textContent = DIVIDERS[commit.sha];
            streamContainer.appendChild(div);
        }
        const node = document.createElement('div');
        node.className = `commit-node cat-${commit.cat || 'feat'}`;
        node.innerHTML = `
            <span class="sha-tag">${commit.sha} // ${commit.tag}</span>
            <div class="commit-title">${commit.desc}</div>
            <div class="commit-meta">
                <span>[${commit.author}]</span>
                <span>${commit.timestamp.split(' ')[1]}</span>
            </div>
        `;
        node.onclick = () => loadCommit(index, node);
        streamContainer.appendChild(node);
    });

    let typeInterval;

    function loadCommit(index, nodeElement) {
        document.querySelectorAll('.commit-node').forEach(n => n.classList.remove('active'));
        nodeElement.classList.add('active');

        emptyState.style.display = 'none';
        detailContainer.classList.remove('visible');

        const data = COMMITS[index];

        setTimeout(() => {
            document.getElementById('detail-sha').innerText = data.sha;
            document.getElementById('detail-tag').innerText = data.tag;
            document.getElementById('detail-author').innerText = `${data.author} :: ${data.role}`;
            document.getElementById('detail-date').innerText = data.timestamp;

            const descBox = document.getElementById('detail-desc');
            const techList = document.getElementById('detail-tech');
            const calloutEl = document.getElementById('detail-callout');
            descBox.innerText = '';
            techList.innerHTML = '';
            calloutEl.style.display = 'none';

            detailContainer.classList.add('visible');

            if (typeInterval) clearInterval(typeInterval);
            let charIndex = 0;
            const text = data.desc;
            descBox.style.borderRightWidth = '2px';

            typeInterval = setInterval(() => {
                descBox.innerText += text.charAt(charIndex);
                charIndex++;

                if (Math.random() > 0.96) {
                    const original = descBox.innerText;
                    descBox.innerText = original.substring(0, original.length - 1) + (Math.random() > 0.5 ? '█' : '▓');
                    setTimeout(() => { descBox.innerText = original; }, 40);
                }

                if (charIndex >= text.length) {
                    clearInterval(typeInterval);
                    descBox.style.borderRightWidth = '0px';

                    data.tech.forEach((item, i) => {
                        setTimeout(() => {
                            const li = document.createElement('li');
                            li.innerHTML = `<span class="bullet">></span><span>${item}</span>`;
                            techList.appendChild(li);
                        }, i * 150);
                    });

                    if (data.callout) {
                        setTimeout(() => {
                            document.getElementById('callout-title').innerText = data.callout.title;
                            document.getElementById('callout-body').innerText = data.callout.body;
                            calloutEl.style.display = 'block';
                        }, data.tech.length * 150 + 200);
                    }
                }
            }, 12);

        }, 200);
    }

    window.onload = () => {
        const firstNode = streamContainer.querySelector('.commit-node');
        if (firstNode) loadCommit(0, firstNode);
    };
